[project]
name = "substrate-sim-datasets"
version = "0.0.0"
description = "Historical shock datasets (2020-2025) with realized paths and placeholder ALFRED vintage metadata, macro catalog, FRED/ALFRED ingest."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2",
    "duckdb>=1.0",
    "pyarrow>=15",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]