[project]
name = "trust"
version = "0.1.0"
description = "@substrate/trust — one measurement discipline for actions and data (02)."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2.5",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "lightgbm>=4.3",
    "netcal>=0.8",
    "datasketch>=1.6",
    "httpx>=0.27",
    "apscheduler>=3.10",
    "pyyaml>=6.0",
    "joblib>=1.3",
    "jsonschema>=4.21",
    "matplotlib>=3.8",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
]

[project.optional-dependencies]
ecosystem = [
    "uncertainty-toolbox>=0.1.1",
    "hdbscan>=0.8.35",
    "psycopg[binary]>=3.1",
    "inspect-ai>=0.3.2",
    "openai>=1.40",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trust"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"