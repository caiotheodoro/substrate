name: efficiency
services:
  eff-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: substrate
      POSTGRES_PASSWORD: substrate
      POSTGRES_DB: substrate
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../03-efficiency/src/ledger/pg/ledger.sql:/docker-entrypoint-initdb.d/01-ledger.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U substrate']
      interval: 5s
      retries: 10

  eff-ollama:
    image: ollama/ollama:latest
    ports:
      - '11434:11434'
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ['CMD-SHELL', 'ollama list || exit 1']
      interval: 10s
      retries: 5
      start_period: 30s

  eff-litellm:
    image: ghcr.io/berriai/litellm:main-latest
    ports:
      - '4000:4000'
    volumes:
      - ./ops/litellm/config.yaml:/app/config.yaml:ro
    command: ['--config', '/app/config.yaml', '--port', '4000']
    depends_on:
      - eff-ollama
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:4000/health/liveliness || exit 1']
      interval: 10s
      retries: 5
      start_period: 30s

  ledger-api:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ..:/app
    ports:
      - '8100:8100'
    environment:
      PORT: '8100'
      SUBSTRATE_LEDGER_DB: postgres
      SUBSTRATE_LEDGER_PG: postgres://substrate:substrate@eff-postgres:5432/substrate
    command: sh -c "npm i -g pnpm@10 >/dev/null 2>&1 && pnpm install >/dev/null 2>&1 && pnpm --filter @substrate/efficiency build && node apps/03-efficiency/dist/ledger/api.js"
    depends_on:
      eff-postgres:
        condition: service_healthy

  cache-analytics:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ..:/app
    ports:
      - '8101:8101'
    environment:
      PORT: '8101'
    command: sh -c "npm i -g pnpm@10 >/dev/null 2>&1 && pnpm install >/dev/null 2>&1 && pnpm --filter @substrate/efficiency build && node apps/03-efficiency/dist/cache/cache-analytics.js"

  routing:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ..:/app
    ports:
      - '8102:8102'
    environment:
      PORT: '8102'
      SUBSTRATE_OLLAMA_URL: http://ollama:11434
      SUBSTRATE_LITELLM_URL: http://litellm:4000
    command: sh -c "npm i -g pnpm@10 >/dev/null 2>&1 && pnpm install >/dev/null 2>&1 && pnpm --filter @substrate/efficiency build && node apps/03-efficiency/dist/routing/routing-service.js"
    depends_on:
      - eff-litellm
      - eff-ollama

  budget-gate:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ..:/app
    ports:
      - '8103:8103'
    environment:
      PORT: '8103'
    command: sh -c "npm i -g pnpm@10 >/dev/null 2>&1 && pnpm install >/dev/null 2>&1 && pnpm --filter @substrate/efficiency build && node apps/03-efficiency/dist/ledger/budget-gate.js"

  escalation-monitor:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ..:/app
    ports:
      - '8104:8104'
    environment:
      PORT: '8104'
    command: sh -c "npm i -g pnpm@10 >/dev/null 2>&1 && pnpm install >/dev/null 2>&1 && pnpm --filter @substrate/efficiency build && node apps/03-efficiency/dist/routing/escalation-monitor.js"

  prometheus:
    image: prom/prometheus:latest
    ports:
      - '9090:9090'
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - ledger-api
      - cache-analytics
      - routing
      - budget-gate
      - escalation-monitor

  grafana:
    image: grafana/grafana:latest
    ports:
      - '3000:3000'
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

volumes:
  pgdata:
  ollama:
