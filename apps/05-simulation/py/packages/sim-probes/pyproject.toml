[project]
name = "substrate-sim-probes"
version = "0.0.0"
description = "Believability probes (A-S-31 behavioral x5, A-S-33 calibration corpus, A-S-34 probe report)."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2",
    "substrate-sim-shared",
]

[project.scripts]
sim-probes = "sim_probes.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]