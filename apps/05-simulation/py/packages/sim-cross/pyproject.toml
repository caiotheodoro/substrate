[project]
name = "substrate-sim-cross"
version = "0.0.0"
description = "Cross-cutting M9: sim-db (DuckDB) + sim-api (:8300) + substrate-bridge."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2",
    "duckdb>=1.0",
    "pydantic>=2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "substrate-sim-shared",
    "substrate-sim-engine",
    "substrate-sim-datasets",
    "substrate-sim-injection",
    "substrate-sim-bench",
]

[tool.pytest.ini_options]
testpaths = ["tests"]