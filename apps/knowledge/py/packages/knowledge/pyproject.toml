[project]
name = "substrate-knowledge"
version = "0.1.0"
description = "@substrate/knowledge (04) — operating retrieval like it's a database"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.8",
    "typer>=0.12",
    "httpx>=0.27",
    "numpy>=1.26",
    "redis>=5.0",
    "psycopg[binary]>=3.3.4",
    "prometheus-client>=0.26.0",
    "apscheduler>=3.11.3",
    "qdrant-client>=1.19.0",
    "splink>=4.0.16",
    "evidently>=0.7.21",
    "outlines>=1.3.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[project.scripts]
knowctl = "substrate_knowledge.m9_platform.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/substrate_knowledge"]
