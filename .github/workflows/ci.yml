name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
      - name: Provision Python venvs (for cross-language e2e)
        run: |
          cd apps/trust/py && uv venv --clear && uv sync --all-groups
          cd ../knowledge/py && uv venv --clear && uv sync --all-packages --all-groups
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm -r typecheck
      - name: Test (substrate, scenarios, harness, efficiency, simulation)
        run: pnpm -r test

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        unit: [trust, knowledge, simulation]
    defaults:
      run:
        working-directory: apps/${{ matrix.unit }}/py
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install
        # knowledge is a uv workspace ROOT with member packages, so its
        # pytest lives in a member's dev group: --all-packages is required.
        # trust/simulation are plain packages where --all-groups suffices.
        # trust's joint2 e2e spawns the knowledge gate, so it provisions
        # knowledge's venv too.
        run: >
          if [ "${{ matrix.unit }}" = "knowledge" ]; then
            uv sync --all-packages --all-groups
          elif [ "${{ matrix.unit }}" = "trust" ]; then
            uv sync --all-groups
            uv --directory ../knowledge/py sync --all-packages --all-groups
          else
            uv sync --all-groups
          fi
      - name: Test
        run: uv run pytest

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate root compose (all profiles)
        run: |
          for p in harness trust efficiency knowledge simulation; do
            docker compose --profile $p config -q
          done
          docker compose config -q

  golden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
      - name: Provision Python venvs (for cross-language e2e)
        run: |
          cd apps/trust/py && uv venv --clear && uv sync --all-groups
          cd ../knowledge/py && uv venv --clear && uv sync --all-packages --all-groups
      - run: pnpm install --frozen-lockfile
      - name: Golden-run replay (byte-identical, mutation breaks CI)
        run: pnpm --filter @substrate/harness test
        env:
          CI: "true"
